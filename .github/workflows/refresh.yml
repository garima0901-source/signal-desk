name: Monthly data refresh

on:
  schedule:
    - cron: '0 6 10 * *' # 10th of each month; Companies House publishes within 5 working days of month end
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Download latest snapshot and rebuild
        run: |
          file=$(curl -s https://download.companieshouse.gov.uk/en_output.html | grep -oE 'BasicCompanyDataAsOneFile-[0-9]{4}-[0-9]{2}-[0-9]{2}\.zip' | head -1)
          snap=$(echo "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          echo "Snapshot: $file ($snap)"
          curl -sf -o snapshot.zip "https://download.companieshouse.gov.uk/$file"
          unzip -p snapshot.zip | node scripts/build-data.js - "$snap"
          rm snapshot.zip
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add public/data/signals.json
          git diff --cached --quiet || git commit -m "Data refresh from Companies House snapshot" && git push
